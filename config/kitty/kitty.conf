#:MasonInstall pyright ts_ls ==============================================================================
# Kitty Configuration - Minimalist Arch Rice
# ==============================================================================

# Font: Maple Mono Nerd Font CN
font_family      Maple Mono NF CN
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Ligatures & Rendering
disable_ligatures              no
enable_audio_bell              no
sync_to_monitor                yes
repaint_delay                  10
input_delay                    3

# Shell
shell                          fish
shell_integration              enabled

# Cursor
cursor_shape                   beam
cursor_blink_interval          0
cursor_trail                   100
cursor_trail_decay             0.05 0.3
cursor_trail_start_threshold   2

# Window Layout & Borders (Strictly borderless)
window_padding_width           10
hide_window_decorations        yes
window_border_width            0
draw_minimal_borders           yes
confirm_os_window_close        0
remember_window_size           no

# Transparency & Compositor Blur
background_opacity             0.80
dynamic_background_opacity     yes

# Mouse & Selection
copy_on_select                 yes
strip_trailing_spaces          smart
mouse_hide_wait                1.5

# Remote control for dynamic reloading
allow_remote_control           yes
listen_on                      unix:@kitty

# Scrollback
scrollback_lines               20000

# Dynamically generated wallpaper-derived color scheme
include ~/.config/matugen/generated/kitty.conf
