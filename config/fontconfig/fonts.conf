<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <!-- Default Monospace -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>monospace</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Maple Mono NF CN</string>
            <string>Maple Mono NF</string>
            <string>Font Awesome 7 Free</string>
        </edit>
    </match>

    <!-- Default Sans-Serif -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>sans-serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Maple Mono NF CN</string>
            <string>Maple Mono NF</string>
            <string>Adwaita Sans</string>
        </edit>
    </match>

    <!-- Default Serif -->
    <match target="pattern">
        <test qual="any" name="family">
            <string>serif</string>
        </test>
        <edit name="family" mode="prepend" binding="strong">
            <string>Maple Mono NF CN</string>
            <string>Maple Mono NF</string>
            <string>Nimbus Roman</string>
        </edit>
    </match>

    <!-- Aliases for generic system fonts -->
    <alias>
        <family>system-ui</family>
        <prefer>
            <family>Maple Mono NF CN</family>
        </prefer>
    </alias>

    <alias>
        <family>ui-monospace</family>
        <prefer>
            <family>Maple Mono NF CN</family>
        </prefer>
    </alias>

    <!-- Fallbacks for Maple Mono NF CN when missing symbols -->
    <match target="pattern">
        <test name="family">
            <string>Maple Mono NF CN</string>
        </test>
        <edit name="family" mode="append" binding="weak">
            <string>Maple Mono NF</string>
            <string>Font Awesome 7 Free</string>
            <string>Font Awesome 7 Brands</string>
            <string>Standard Symbols PS</string>
        </edit>
    </match>

    <!-- Rendering optimizations: antialias, hinting, subpixel geometry -->
    <match target="font">
        <edit mode="assign" name="antialias"><bool>true</bool></edit>
        <edit mode="assign" name="hinting"><bool>true</bool></edit>
        <edit mode="assign" name="hintstyle"><const>hintslight</const></edit>
        <edit mode="assign" name="rgba"><const>rgb</const></edit>
        <edit mode="assign" name="lcdfilter"><const>lcddefault</const></edit>
    </match>
</fontconfig>
