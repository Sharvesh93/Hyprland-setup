[templates.hyprland]
input_path = "~/.config/matugen/templates/hyprland-colors.conf"
output_path = "~/.config/hypr/colors.conf"

[templates.rofi]
input_path = "~/.config/matugen/templates/rofi.rasi"
output_path = "~/.config/matugen/generated/rofi.rasi"

[templates.rofi_wallpaper]
input_path = "~/.config/matugen/templates/rofi-wallpaper.rasi"
output_path = "~/.config/rofi/wallpaper-select.rasi"
