# ==============================================================================
# Minimalist Hyprlock Rice
# Dynamic Theming & Wallpaper Matched Colors
# primary font: Maple Mono NF CN
# ==============================================================================

source = ~/.config/hypr/colors.conf

general {
    hide_cursor = true
    immediate_render = true
}

background {
    monitor =
    path = ~/.cache/current_wallpaper_lock.jpg
    color = $background
    
    # Subtle blur and dark overlay
    blur_passes = 3
    blur_size = 6
    noise = 0.015
    contrast = 0.90
    brightness = 0.75
    vibrancy = 0.17
    vibrancy_darkness = 0.0
}

# Digital Clock (Bold emphasis)
label {
    monitor =
    text = $TIME
    color = $on_surface
    font_size = 72
    font_family = Maple Mono NF CN Bold
    position = 0, 140
    halign = center
    valign = center
}

# Minimal Date Display (Medium label)
label {
    monitor =
    text = cmd[update:1000] date +"%A, %d %B %Y"
    color = $primary
    font_size = 14
    font_family = Maple Mono NF CN Medium
    position = 0, 80
    halign = center
    valign = center
}

# Small Username Display (Medium label)
label {
    monitor =
    text = $USER
    color = $on_surface_variant
    font_size = 14
    font_family = Maple Mono NF CN Medium
    position = 0, -20
    halign = center
    valign = center
}

# Minimal Password Input Field (Regular text)
input-field {
    monitor =
    size = 280, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.25
    dots_center = true
    outer_color = $outline_variant
    inner_color = $surface_alpha
    font_color = $on_surface
    font_family = Maple Mono NF CN
    fade_on_empty = false
    placeholder_text = <span foreground="##c3c6cf"><i>Password...</i></span>
    hide_input = false
    rounding = 23
    check_color = $primary
    fail_color = $error
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    position = 0, -80
    halign = center
    valign = center
}

# Minimal Battery Indicator (Medium label)
label {
    monitor =
    text = cmd[update:5000] ~/.config/hypr/scripts/battery-status.sh
    color = $on_surface_variant
    font_size = 12
    font_family = Maple Mono NF CN Medium
    position = 0, 30
    halign = center
    valign = bottom
}
